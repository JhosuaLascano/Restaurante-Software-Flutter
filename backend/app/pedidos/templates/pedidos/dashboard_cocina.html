{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocina - Chucha Orden</title>

    <!-- Google Fonts: Outfit & Playfair Display (igual que el login) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'pedidos/css/cocina.css' %}?v=1.0">

    <script src="https://unpkg.com/htmx.org@1.9.6"></script>
    <script src="https://unpkg.com/idiomorph/dist/idiomorph-ext.min.js"></script>
</head>
<body>

    <header class="kitchen-hero">
        <div class="hero-inner">
            <div class="hero-top">
                <div class="brand">
                    <div class="icon-circle"><i class="fas fa-utensils"></i></div>
                    <span class="brand-name">Chucha Orden</span>
                </div>

                <div class="hero-actions">
                    <div class="live-badge">
                        <span class="live-dot"></span>
                        <span>En vivo</span>
                    </div>
                    <a href="{% url 'usuarios:logout' %}" class="btn-exit">
                        Salir <i class="fas fa-sign-out-alt"></i>
                    </a>
                </div>
            </div>

            <div class="hero-bottom">
                <div>
                    <span class="subtitle-overlay">Cocina &middot; Comandas pendientes</span>
                    <h1 class="hero-title">Buen servicio, Chef.</h1>
                    <div class="line-accent"></div>
                </div>

                <div class="hero-stats">
                    <div class="stat">
                        <div class="stat-value accent" id="stat-pendientes">{{ pedidos|length }}</div>
                        <div class="stat-label">Pendientes</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="stat-hora">--:--</div>
                        <div class="stat-label">Hora actual</div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="grid-pedidos"
         id="grid-pedidos"
         hx-ext="morph"
         hx-get="{% url 'pedidos:actualizar_cocina' %}"
         hx-trigger="every 5s"
         hx-swap="morph:innerHTML">

        {% include 'pedidos/partials/lista_pedidos_cocina.html' %}

    </main>

    <script>
        // Minutos de espera por comanda (amarillo >= 10 min, rojo >= 20 min)
        function actualizarCocina() {
            const ahora = new Date();
            document.getElementById('stat-hora').textContent =
                ahora.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });

            const cards = document.querySelectorAll('.kitchen-card');
            document.getElementById('stat-pendientes').textContent = cards.length;

            cards.forEach(card => {
                const creado = new Date(card.dataset.created);
                if (isNaN(creado)) return;
                const min = Math.max(0, Math.floor((ahora - creado) / 60000));
                const label = card.querySelector('.elapsed');
                if (label) label.textContent = min < 1 ? 'Recién' : min + ' min';
                card.classList.toggle('is-late', min >= 10 && min < 20);
                card.classList.toggle('is-urgent', min >= 20);
            });
        }

        actualizarCocina();
        setInterval(actualizarCocina, 30000);
        document.body.addEventListener('htmx:afterSwap', actualizarCocina);
    </script>

</body>
</html>
